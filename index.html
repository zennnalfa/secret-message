<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Denayla Salsabila Azaeela Bunga Az-Zahra</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        overflow-x: hidden;
        background: #ffd9e8;
      }
      #bg {
        position: fixed;
        inset: 0;
        background-size: cover;
        background-position: center;
        filter: blur(6px) brightness(0.45);
        z-index: -2;
        animation: bg 40s infinite;
      }
      @keyframes bg {
        0% {
          background-image: url("1.jpg");
        }
        10% {
          background-image: url("2.jpg");
        }
        20% {
          background-image: url("3.jpg");
        }
        30% {
          background-image: url("4.jpg");
        }
        40% {
          background-image: url("5.jpg");
        }
        50% {
          background-image: url("6.jpg");
        }
        60% {
          background-image: url("7.jpg");
        }
        70% {
          background-image: url("8.jpg");
        }
        80% {
          background-image: url("9.jpg");
        }
        100% {
          background-image: url("10.jpg");
        }
      }
      #envelopeScreen {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffd6e8, #ffc1d9);
      }
      .envelope {
        background: #fff;
        padding: 40px;
        border-radius: 25px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        width: min(90vw, 420px);
      }
      .heart {
        font-size: 55px;
        cursor: pointer;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.15);
        }
      }
      .card {
        display: none;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(92vw, 750px);
        max-height: 85vh;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        padding: 25px;
        border-radius: 25px;
      }
      h1 {
        text-align: center;
      }
      #message {
        min-height: 220px;
        margin-top: 15px;
        line-height: 1.8;
      }
      .progress {
        height: 8px;
        background: #ddd;
        border-radius: 99px;
        margin: 10px 0;
      }
      .bar {
        height: 100%;
        background: #ff5d91;
        width: 0;
        border-radius: 99px;
      }
      .btns {
        text-align: center;
        margin-top: 20px;
      }
      .btns button {
        padding: 10px 18px;
        border: none;
        border-radius: 30px;
        margin: 5px;
      }
      #next {
        background: #ff5d91;
        color: white;
      }
      .floating {
        position: fixed;
        animation: fly 7s linear forwards;
      }
      @keyframes fly {
        from {
          transform: translateY(100vh);
        }
        to {
          transform: translateY(-20vh);
          opacity: 0;
        }
      }
      #finale {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        color: white;
        text-align: center;
        overflow: auto;
        padding: 30px;
      }
      .bigtitle {
        font-size: clamp(34px, 6vw, 80px);
        font-weight: bold;
        text-shadow: 0 0 25px hotpink;
        animation: zoom 3s infinite alternate;
      }
      @keyframes zoom {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.05);
        }
      }
      .collage {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        max-width: 900px;
        margin: 25px auto;
      }
      .collage img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 15px;
      }
      canvas {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>

    <div id="envelopeScreen">
      <div class="envelope">
        <h2>Halooo Denayla Salsabila Azaeela Bunga Az-Zahra</h2>
        <br />
        <p>click my hearth dibawah ini</p>
        <br />
        <div class="heart" id="openBtn">❤️</div>
      </div>
    </div>

    <div class="card" id="card">
      <h1 id="title"></h1>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div id="message"></div>
      <div class="btns">
        <button onclick="prevSlide()">Back</button>
        <button id="next" onclick="nextSlide()">Next</button>
      </div>
    </div>

    <div id="finale">
      <div class="bigtitle">
        🎉 HAPPY BIRTHDAY 🎉<br />
        DENAYLA SALSABILA AZAEELA<br />
        BUNGA AZ-ZAHRA
      </div>
      <h2 style="margin-top: 20px">19 Years of Amazing You ✨</h2>

      <div class="collage">
        <img src="1.jpg" /><img src="9.jpg" /><img src="3.jpg" />
        <img src="2.jpg" /><img src="4.jpg" /><img src="5.jpg" />
        <img src="6.jpg" /><img src="7.jpg" /><img src="8.jpg" />
      </div>
    </div>

    <canvas id="fireworks"></canvas>

    <audio id="bgm" loop>
      <source src="lagu.mp3" type="audio/mpeg" />
    </audio>

    <script>
      const slides = [
        [
          "🎂 Happy 19th Birthday 🎂",
          "<br>pertama-tama, selamat ulang tahun yang ke-19 yaaa! jujur aja, aku masih heran gimana bisa satu orang punya nama secantik dan sepanjang itu sekaligus 😭. semoga di umur yang baru ini kamu makin bahagia, makin kuat, dan makin banyak hal baik yang datang ke hidup kamu. oh iya, web ini dibuat khusus buat kamu, mungkin tampilannya nggak sempurna, tapi niat bikin dan bahagianya pas ngerjain ini ♾️% asli ko hehe 😌✨<br>",
        ],
        [
          "📜Pantun Spesial Untuk Orang Special📜",
          "jalan-jalan ke taman sari...cakeppp, lihat kupu-kupu terbang tinggi...cakeppp, hari ini kamu ulang tahun lagi, semoga bahagia selalu menemani. oke aku tau pantunnya nggak bakal masuk lomba 😭. tapi serius, salah satu hal yang bikin hari-hari orang jadi lebih enak itu ya karena ada kamu. jadi kalau hari ini banyak yang bilang kamu cantik, baik, dan hebat...percaya aja karena emang bener kok 😌",
        ],
        [
          "💌Terima Kasih💌",
          "makasih yaa karena selama ini selalu jadi orang yang enak diajak cerita. makasih karena sering dengerin hal-hal random yang kadang bahkan aku sendiri nggak ngerti lagi kenapa aku ceritain. makasih juga karena selalu punya cara buat bikin suasana jadi lebih nyaman. mungkin aku nggak selalu bilang, tapi aku beneran bersyukur bisa kenal kamu. dan semoga setelah ulang tahun ini, kamu tetap jadi Denayla yang baik, hangat, dan selalu bikin orang di sekitarnya merasa dihargai 🤍",
        ],
        [
          "🌻Untuk Kamu🌻",
          "kalau suatu hari kamu capek, sedih, atau lagi ngerasa semuanya berat.....tolong jangan hadapin semuanya sendirian ya. nggak harus selalu kuat setiap saat kok. nggak apa-apa istirahat...nggak apa-apa cerita...nggak apa-apa minta ditemenin. karena orang sebaik kamu juga berhak dapat perhatian dan dukungan. jadi kalau suatu saat dunia lagi nyebelin, ingat aja...masih ada banyak orang yang peduli sama kamu. termasuk aku 😊",
        ],
        [
          "✨Pesan Terakhir✨",
          "selamat ulang tahun sekali lagi ya, Denayla Salsabila Azaeela Bunga Az-Zahra 🥳💖✨ hari ini kamu genap berusia 19 tahun, dan aku berharap hari spesial ini dipenuhi banyak kebahagiaan, tawa, dan hal-hal baik yang bikin kamu tersenyum. mungkin nggak semua orang tahu seberapa banyak hal yang sudah kamu lewati sampai bisa berada di titik ini, tapi aku tahu kalau beberapa hal dalam hidupmu nggak selalu mudah. ada banyak harapan, banyak keinginan orang tua yang harus kamu pertimbangkan, ada banyak keputusan yang mungkin harus kamu pikirkan baik-baik, dan kadang itu pasti melelahkan. tapi di tengah semua itu, kamu tetap berusaha bertahan, tetap berjalan maju, dan tetap menjadi pribadi yang baik. jujur, aku kagum sama kamu. nggak semua orang bisa sekuat itu menghadapi keadaan tanpa banyak mengeluh. jadi kalau hari ini ada yang pantas dirayakan, bukan cuma karena umurmu bertambah satu tahun, tapi juga karena kamu berhasil melewati semua hari-hari yang pernah membuatmu lelah, sedih, bingung, atau bahkan ragu pada diri sendiri. terima kasih ya, karena sudah bertahan sejauh ini, terima kasih karena sudah menjadi Denayla yang selalu berusaha memberikan yang terbaik, yang tetap peduli sama orang lain meskipun kadang dirinya sendiri juga sedang banyak pikiran. dan aku juga mau minta maaf karena hari ini aku belum bisa ngucapin selamat ulang tahun secara langsung ke kamu. sebenarnya aku pengen banget bisa ngucapin secara langsung dan ikut merayakan hari spesialnya, tapi hari ini aku masih harus masuk kerja dan ada tanggung jawab yang nggak bisa aku tinggalkan. jadi untuk sementara, aku cuma bisa menyampaikan semuanya lewat pesan sederhana ini. semoga meskipun cuma lewat layar, kamu tetap bisa merasakan kalau ada seseorang yang benar-benar ikut bahagia karena hari ini adalah hari lahirmu. untuk umur yang ke-19 ini, semoga langkah kamu selalu dipermudah, semoga semua usaha yang kamu lakukan menemukan hasil terbaiknya, semoga apa yang sedang kamu perjuangkan sekarang perlahan-lahan mendekat menjadi kenyataan, semoga kamu selalu dikelilingi orang-orang yang tulus menyayangimu, semoga kesehatan, kebahagiaan, dan ketenangan selalu menemani hari-harimu, dan semoga ketika ada hari yang terasa berat, kamu selalu diberi kekuatan untuk melewatinya. dan satu pesan terakhir yang paling penting, jangan terlalu keras sama diri sendiri ya. nggak apa-apa kalau sesekali merasa lelah, nggak apa-apa kalau sesekali ingin berhenti sejenak untuk beristirahat, karena kamu juga manusia yang berhak untuk capek. sering kali kamu jauh lebih hebat daripada yang kamu kira, dan sering kali kamu sudah melakukan yang terbaik meskipun dirimu sendiri belum menyadarinya. jadi hari ini, senyum yang banyak yaa, makan yang enak, nikmati semua perhatian dan doa baik yang datang untukmu, dan rayakan hari spesialmu dengan bahagia. selamat ulang tahun, Denayla Salsabila Azaeela Bunga Az-Zahra 🎂🌷💖 semoga tahun ini menjadi salah satu tahun terbaik dalam hidupmu, dan semoga semua hal baik yang kamu harapkan, satu per satu, datang menghampirimu. ✨l",
        ],
      ];
      let idx = 0;

      function render() {
        document.getElementById("title").innerHTML = slides[idx][0];
        document.getElementById("message").innerHTML = slides[idx][1];
        document.getElementById("bar").style.width =
          ((idx + 1) / slides.length) * 100 + "%";
        document.getElementById("next").innerHTML =
          idx === slides.length - 1 ? "🎉 Open Your Surprise" : "Next";
      }

      document.getElementById("openBtn").onclick = () => {
        document.getElementById("envelopeScreen").style.display = "none";
        document.getElementById("card").style.display = "block";
        document
          .getElementById("bgm")
          .play()
          .catch(() => {});
        render();
        setInterval(spawnHeart, 500);
      };

      function nextSlide() {
        if (idx < slides.length - 1) {
          idx++;
          render();
        } else finale();
      }
      function prevSlide() {
        if (idx > 0) {
          idx--;
          render();
        }
      }

      function spawnHeart() {
        const h = document.createElement("div");
        h.className = "floating";
        h.innerHTML = Math.random() > 0.5 ? "💖" : "🌸";
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = 20 + Math.random() * 20 + "px";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 7000);
      }

      function finale() {
        document.getElementById("card").style.display = "none";
        document.getElementById("finale").style.display = "block";
        startFireworks();
      }

      function startFireworks() {
        const c = document.getElementById("fireworks");
        const ctx = c.getContext("2d");
        c.width = innerWidth;
        c.height = innerHeight;
        let particles = [];
        setInterval(() => {
          let x = Math.random() * c.width,
            y = Math.random() * c.height * 0.7;
          for (let i = 0; i < 50; i++) {
            particles.push({
              x,
              y,
              vx: (Math.random() - 0.5) * 6,
              vy: (Math.random() - 0.5) * 6,
              l: 60,
            });
          }
        }, 500);
        function anim() {
          ctx.clearRect(0, 0, c.width, c.height);
          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.l--;
            ctx.fillStyle = `hsl(${Math.random() * 360},100%,60%)`;
            ctx.fillRect(p.x, p.y, 3, 3);
          });
          particles = particles.filter((p) => p.l > 0);
          requestAnimationFrame(anim);
        }
        anim();
      }
    </script>
  </body>
</html>
